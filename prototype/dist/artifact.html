<title>Employee Discount Platform</title>
<meta name="description" content="Interactive demo of the Employee Discount Platform by RIWA: employee app, cashier till and admin panel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Urbanist:wght@500;600;700;800&display=swap">
<style>
/* Employee Discount Platform — interactive demo by RIWA.
   Palette comes straight from the RIWA mark: ink #151B35, blue #175195, wave #3792C2.
   One deliberate light look: navy chrome around light working surfaces. */

:root{
  --ink:#151B35; --ink-2:#232B4A; --ink-3:#3A4366;
  --blue:#175195; --blue-h:#11447F; --wave:#3792C2;
  --blue-t:#E7EEF7; --wave-t:#E4F0F8;
  --ground:#ECEFF5; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#EBEFF5;
  --line:#DDE2EB; --line-2:#C7CEDB;
  --text:#151B35; --muted:#586180; --faint:#8C94AA;
  --ok:#1B6A44; --ok-t:#E1F0E8; --ok-b:#3FA46F;
  --warn:#8A520A; --warn-t:#FAEFD8; --warn-b:#DFA23A;
  --bad:#AB2A21; --bad-t:#FAE4E1; --bad-b:#DD6A5E;
  --f-display:"Urbanist","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--faint)}
.ic{width:18px;height:18px;flex:none}
.nowrap{white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row-in{display:flex;gap:8px}
.row-in .input{flex:1}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.err{margin:0;font-size:13px;color:var(--bad);font-weight:500}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 20px;padding:10px 20px;background:var(--ink);color:#DDE3F0}
.tb-brand{display:flex;align-items:center;gap:12px;min-width:0}
.tb-mark{height:30px;width:auto;flex:none}
.tb-title{font:700 15.5px/1.15 var(--f-display);color:#fff;letter-spacing:.01em}
.tb-sub{font-size:11.5px;color:#97A2C1}
.tb-views{display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.07);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tb-view{display:flex;align-items:center;gap:7px;padding:7px 13px;border:0;border-radius:7px;background:none;color:#B3BDD8;font-weight:500;font-size:13.5px;white-space:nowrap}
.tb-view .ic{width:16px;height:16px}
.tb-view:hover{color:#fff}
.tb-view.on{background:#fff;color:var(--ink)}
.tb-tools{display:flex;gap:8px;justify-self:end}
.tb-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:none;color:#E6EBF5;font-weight:500;font-size:13px;white-space:nowrap}
.tb-btn .ic{width:16px;height:16px}
.tb-btn:hover{background:rgba(255,255,255,.08)}
.tb-btn.accent{background:var(--wave);border-color:var(--wave);color:#fff}
.tb-btn.accent:hover{background:#2E82B0}
@media (max-width:1180px){.topbar{grid-template-columns:minmax(0,1fr) auto}.tb-views{grid-column:1/-1;grid-row:2;justify-self:start}}
@media (max-width:600px){.tb-sub{display:none}.tb-btn span{display:none}.topbar{padding:10px 16px}}

/* ---------- stage ---------- */
.stage{padding:22px 20px 36px}
.foot{max-width:1540px;margin:0 auto;padding:0 20px 28px;display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.intro{max-width:1500px;margin:0 auto 16px;display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:13px}
.intro .ic{margin-top:1px}
.intro b{color:var(--ink);font-weight:600}
.counter{display:grid;grid-template-columns:376px minmax(0,1fr);gap:28px;align-items:start;max-width:1500px;margin:0 auto}
.col-label{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.col-label .ic{width:15px;height:15px}
.col-label span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.till-wrap{min-width:0}
.solo{display:grid;grid-template-columns:376px minmax(0,600px);gap:36px;justify-content:center;align-items:start;max-width:1200px;margin:0 auto}
.cashier-solo{max-width:1280px;margin:0 auto}
@media (max-width:1180px){.counter{grid-template-columns:minmax(0,1fr);justify-items:center}.counter>.till-wrap{width:100%}}
@media (max-width:1040px){.solo{grid-template-columns:minmax(0,1fr);justify-items:center}.solo>aside{width:100%}}
@media (max-width:600px){.stage{padding:16px 16px 28px}.foot{padding:0 16px 24px}}

/* ---------- buttons, inputs, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn .ic{width:17px;height:17px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--blue-h);border-color:var(--blue-h)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ink:hover:not(:disabled){background:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:#E7B8B2}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.lg{padding:13px 18px;font-size:15px;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px;gap:6px}
.btn.sm .ic{width:15px;height:15px}
.btn:disabled{opacity:.42}
.link{padding:0;border:0;background:none;color:var(--blue);font-weight:600;font-size:inherit;text-align:left}
.link:hover:not(:disabled){text-decoration:underline}
.link:disabled{opacity:.4}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;flex:none;border:0;border-radius:8px;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field>label,.field>legend{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0}
.field legend{margin-bottom:6px}
.input{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.input:focus{border-color:var(--blue);outline:3px solid rgba(23,81,149,.14);outline-offset:0}
.input[readonly]{background:var(--surface-2);color:var(--muted)}
textarea.input{resize:vertical;line-height:1.5}
select.input{padding-right:28px}
.input.lg{padding:13px 14px;font-size:16px;border-radius:12px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--blue)}
.check.sm{font-size:12.5px;color:var(--muted)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;font-size:13.5px}
.switch input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:36px;height:20px;margin:0;border-radius:99px;background:var(--line-2);cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(21,27,53,.25);transition:transform .15s}
.switch input:checked{background:var(--blue)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:disabled{opacity:.55;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-t);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warn-t);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--bad-t);border-color:transparent;color:var(--bad)}
.pill.blue{background:var(--blue-t);border-color:transparent;color:var(--blue)}
.bchips{display:inline-flex;gap:3px;flex-wrap:wrap}
.bchip{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;color:#fff;font:700 11px/1 var(--f-display)}

.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:9px;background:var(--surface-3)}
.seg>button,.seg>label{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg>.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(21,27,53,.14)}
.seg input{position:absolute;opacity:0;pointer-events:none}

.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;font-size:13px;line-height:1.4}
.note .ic{margin-top:1px}
.note b{display:block;font-weight:600}
.note span{display:block}
.note.warn{background:var(--warn-t);color:var(--warn)}
.note.bad{background:var(--bad-t);color:var(--bad)}
.note.ok{background:var(--ok-t);color:var(--ok)}
.note.info{background:var(--blue-t);color:var(--blue)}

.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;object-fit:cover;color:#fff;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;background:var(--surface-3)}
.av.sq{border-radius:12px}
.tile{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 18px/1 var(--f-display)}
.tile .ic{width:20px;height:20px}
.tile.sm{width:32px;height:32px;border-radius:9px;font-size:14px}
.tile.lg{width:48px;height:48px;border-radius:13px;font-size:22px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12px;color:var(--muted)}

/* ---------- phone ---------- */
.dev-col{display:flex;flex-direction:column;align-items:center;gap:14px;width:376px;max-width:100%}
.phone{width:376px;max-width:100%;height:780px;padding:11px;border-radius:54px;background:#0D1124;box-shadow:inset 0 0 0 1.5px #2B3253,0 30px 60px -32px rgba(21,27,53,.6)}
.phone-screen{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:44px;background:var(--surface-2);isolation:isolate}
.phone-screen::before{content:"";position:absolute;top:11px;left:50%;z-index:8;width:98px;height:28px;margin-left:-49px;border-radius:20px;background:#0D1124}
.phone-screen.flash::after{content:"";position:absolute;inset:0;z-index:9;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.sb{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:8px 26px 0 34px;font:700 14.5px var(--f-display);color:var(--ink)}
.sb-ic{display:flex;gap:6px;align-items:center}
.ph-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 22px;border-top:1px solid var(--line);background:var(--surface)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--faint);font-size:11px;font-weight:600}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--blue)}
@media (max-width:520px){.dev-col{width:100%}.phone{width:100%;height:740px;padding:0;border-radius:24px;background:none;box-shadow:none}.phone-screen{border-radius:24px;border:1px solid var(--line)}.phone-screen::before{display:none}.sb{padding:4px 20px 0}}

.sms{position:absolute;top:50px;left:10px;right:10px;z-index:7;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(248,249,251,.97);box-shadow:0 14px 30px -12px rgba(21,27,53,.4);text-align:left;animation:drop .35s ease-out}
.sms-ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:#fff}
.sms-ic .ic{width:16px;height:16px}
.sms-t{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.sms-t b{font-weight:600}
.sms-t small{color:var(--muted)}
.sms p{margin:2px 0 0;font-size:13px;line-height:1.35}
.sms em{font-style:normal;font-weight:600}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

.scr{display:flex;flex-direction:column;gap:18px;padding:6px 20px 28px}
.scr h1{margin:0;font:700 26px/1.12 var(--f-display);letter-spacing:-.01em}
.scr h2{margin:0;font:700 17px/1.2 var(--f-display)}
.lead{margin:6px 0 0;color:var(--muted);font-size:14px}
.fine{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.meta{font-size:12.5px;color:var(--muted)}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:3px;margin:0 0 -6px -6px;padding:4px 6px;border:0;background:none;color:var(--blue);font-weight:600;font-size:14px}
.login{padding-top:34px;gap:22px}
.login-mark{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:var(--ink);color:#fff}
.login-mark .ic{width:27px;height:27px}
.otp{letter-spacing:.45em;font-size:22px!important;text-align:center;font-family:var(--f-mono)}
.hello{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.hello h1{margin-top:1px}

.allow{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:18px 18px 15px;border-radius:20px;background:var(--ink);color:#fff}
.allow .wave{position:absolute;right:-30px;bottom:-54px;width:176px;height:auto;opacity:.2;pointer-events:none}
.allow>*:not(.wave){position:relative}
.al-l{font-size:13px;color:#A9B4D2;font-weight:500}
.amt{display:flex;align-items:baseline;font:700 46px/1 var(--f-display);letter-spacing:-.02em}
.amt .dec{font-size:22px;color:#A9B4D2;letter-spacing:0}
.amt .cur{margin-left:8px;font-size:15px;font-weight:600;color:#A9B4D2;letter-spacing:.03em}
.allow .meter{background:rgba(255,255,255,.14)}
.al-row{display:flex;justify-content:space-between;font-size:13px;color:#C6CEE4}
.al-row b{color:#fff;font-weight:600}
.al-foot{padding-top:9px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8F9BBC}
.allow.paused{background:#454C68}
.meter{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;min-width:3px;border-radius:inherit;background:var(--wave)}
.meter.warn i{background:var(--warn-b)}
.meter.full i{background:var(--bad-b)}
.meter.sm{height:6px}

.rows{list-style:none;margin:0;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rows>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;color:inherit;text-align:left}
button.row:hover:not(:disabled){background:var(--surface-2)}
button.row:disabled{opacity:.5}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{font-size:12.5px;color:var(--muted)}
.row.locked{color:var(--faint)}
.row.locked .tile{opacity:.35}
.row.locked .main b{color:var(--muted)}
.row .ic.muted{color:var(--faint)}
.rate{font:700 15px var(--f-display);color:var(--blue)}
.amt-r{display:flex;flex-direction:column;align-items:flex-end;font-weight:600;white-space:nowrap}
.amt-r small{font-size:11.5px;font-weight:400;color:var(--muted)}
.tx.reversed .amt-r>span{text-decoration:line-through;color:var(--faint)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
.empty{margin:0;padding:16px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface);color:var(--muted);font-size:13px;text-align:center}
.search{position:relative;min-width:0}
.search>.ic{position:absolute;left:11px;top:50%;margin-top:-9px;color:var(--faint);pointer-events:none}
.search .input{padding-left:36px}
.h-tile{display:flex;gap:12px;align-items:center}

.code-h{display:flex;align-items:center;gap:12px}
.code-h .back{margin:0 0 0 -8px}
.code-h b{display:block;font:700 18px/1.15 var(--f-display)}
.code-h small{display:block;font-size:12.5px;color:var(--muted)}
.code-card{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.qr{align-self:center;width:216px;max-width:100%;aspect-ratio:1}
.qr svg{display:block;width:100%;height:100%}
.qr-fallback{display:grid;place-items:center;height:100%;padding:16px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);font-size:12.5px;text-align:center}
.live{position:relative;height:32px;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--wave-t)}
.live::before{content:"";position:absolute;top:0;bottom:0;left:-60px;right:0;background:repeating-linear-gradient(115deg,transparent 0 12px,rgba(55,146,194,.34) 12px 22px);animation:slide 1s linear infinite}
@keyframes slide{to{transform:translateX(24.27px)}}
.live span{position:relative;display:inline-flex;align-items:center;gap:7px;padding:3px 9px;border-radius:6px;background:var(--surface);font:600 13px var(--f-mono);color:var(--blue)}
.live span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wave);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.code-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.code-meta b{display:block;font:600 16px var(--f-mono);color:var(--ink);letter-spacing:.08em}
.ring{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.ring svg{width:24px;height:24px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .trk{stroke:var(--surface-3)}
.ring .val{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.facts li{display:flex;gap:8px;align-items:flex-start}
.facts .ic{width:16px;height:16px;margin-top:2px;color:var(--blue)}

.center{align-items:center;text-align:center;padding-top:34px}
.big-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.big-ic .ic{width:34px;height:34px}
.big-ic.ok{background:var(--ok-t);color:var(--ok)}
.big-ic.wait{background:var(--blue-t);color:var(--blue);animation:breathe 1.8s ease-in-out infinite}
.big-ic.bad{background:var(--bad-t);color:var(--bad)}
@keyframes breathe{50%{box-shadow:0 0 0 14px rgba(23,81,149,.08)}}
.saved{font:700 42px/1 var(--f-display);letter-spacing:-.02em}
.saved small{margin-left:6px;font-size:17px;color:var(--muted);letter-spacing:0}
.kv{width:100%;margin:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:13.5px}
.kv>div+div{border-top:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.mini-allow{width:100%;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.mini-allow .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.mini-allow .top b{font:700 20px var(--f-display);color:var(--ink)}

.sumstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sumstrip>div{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.sumstrip>div+div{border-left:1px solid var(--line)}
.sumstrip small{font-size:11.5px;color:var(--muted)}
.sumstrip b{font:700 16px var(--f-display)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chip{flex:none;padding:6px 11px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hgroup h3{margin:0 0 8px;font:600 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hwrap{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.htbl{width:100%;border-collapse:collapse;font-size:12.5px}
.htbl th{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;text-align:left}
.htbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.htbl tbody tr:last-child td{border-bottom:0}
.htbl td b{display:block;font-weight:600}
.htbl td small{display:block;font-size:11.5px;color:var(--muted)}
.htbl .r{text-align:right;white-space:nowrap}
.htbl tfoot td{border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2);font-weight:600}
.htbl tr.rev td{color:var(--faint)}
.htbl tr.rev .d{text-decoration:line-through}
.prof{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px;text-align:center}

/* demo controls under the phone */
.proto{width:100%;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed #A5AFC6;border-radius:14px;background:rgba(255,255,255,.55)}
.proto-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.proto-h .ic{width:14px;height:14px}
.proto-row{display:flex;gap:8px;flex-wrap:wrap}
.proto-sub{font-size:12px;font-weight:600;color:var(--muted)}
.accts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acct{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left}
.acct b{font-size:12.5px;font-weight:600}
.acct small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--muted)}
.acct:hover{border-color:var(--line-2)}
.acct.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

/* ---------- cashier till ---------- */
.till{display:flex;flex-direction:column;min-height:780px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 30px 60px -44px rgba(21,27,53,.45)}
.till-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding:10px 16px;background:var(--ink-2);color:#D3DAEB;font-size:13px}
.till-id{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.till-id b{color:#fff;font-weight:600}
.till-sel{max-width:100%;padding:5px 8px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:rgba(255,255,255,.08);color:#fff}
.till-sel option,.till-sel optgroup{background:#fff;color:var(--ink)}
.till-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.till-meta b{color:#fff;font-weight:600}
.pos-link{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.pos-link::before{content:"";width:7px;height:7px;border-radius:50%;background:#4CC38A}
.pos-link.manual::before{background:var(--warn-b)}
.till-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);min-height:0}
.catalog{display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px;border-right:1px solid var(--line);background:var(--surface-2)}
.cat-h h2{margin:2px 0 0;font:700 18px var(--f-display)}
.ctabs{display:flex;gap:6px;flex-wrap:wrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:98px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.item:hover:not(:disabled){border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.item:disabled{opacity:.5}
.item .n{font-weight:600;line-height:1.25}
.item .c{font-size:11.5px;color:var(--muted)}
.item.x .c{color:var(--warn);font-weight:600}
.item .p{margin-top:auto;font:600 15px var(--f-mono)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px}
@media (max-width:900px){.till-grid{grid-template-columns:minmax(0,1fr)}.catalog{border-right:0;border-bottom:1px solid var(--line)}}

.ep{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ep-idle{border-color:transparent;background:var(--blue-t)}
.ep-h{display:flex;gap:12px;align-items:center}
.ep-h b{display:block;font:700 16px var(--f-display)}
.ep-h small{display:block;font-size:12.5px;color:var(--muted)}
.ep-res{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px}
.ep-res .ic{width:22px;height:22px}
.ep-res b{display:block;font:700 15.5px var(--f-display)}
.ep-res span{display:block;font-size:12.5px}
.ep-res.ok{background:var(--ok-t);color:var(--ok)}
.ep-res.bad{background:var(--bad-t);color:var(--bad)}
.ep-emp{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.ep-photo{display:flex;flex-direction:column;gap:4px}
.ep-photo .av{width:96px!important;height:124px!important;border-radius:10px;font-size:32px!important}
.ep-photo small{font-size:11px;color:var(--warn);font-weight:600;text-align:center}
.ep-who{display:flex;flex-direction:column;gap:2px;min-width:0}
.ep-who .nm{font:700 19px/1.2 var(--f-display)}
.ep-who .mono{font-size:13px}
.ep-who .dept{font-size:12.5px;color:var(--muted)}
.ep-left{display:flex;flex-direction:column;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ep-left small{font-size:11.5px;color:var(--muted)}
.ep-left b{font:700 21px var(--f-display)}
.ep-left b small{font:500 12px var(--f-body)}
.photo-ok{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--warn-b);border-radius:10px;background:var(--warn-t);color:var(--warn);font-weight:600;font-size:13px;cursor:pointer}
.photo-ok.on{border-color:var(--ok-b);background:var(--ok-t);color:var(--ok)}
.photo-ok input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--ok)}
.checks summary{display:flex;align-items:center;gap:6px;list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--ok)}
.checks summary::-webkit-details-marker{display:none}
.checks summary .ic{width:16px;height:16px}
.checks summary::after{content:"Show";margin-left:auto;font-weight:500;color:var(--blue);font-size:12.5px}
.checks[open] summary::after{content:"Hide"}
.checklist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.35}
.checklist li>.ic{flex:none;width:18px;height:18px;padding:2px;margin-top:0;border-radius:50%}
.checklist li.ok>.ic{background:var(--ok-t);color:var(--ok)}
.checklist li.bad>.ic{background:var(--bad-t);color:var(--bad)}
.checklist li.skip>.ic{background:var(--surface-3);color:var(--faint)}
.checklist li.skip{color:var(--faint)}
.checklist b{font-weight:600}
.checklist small{display:block;font-size:12.5px;color:var(--muted)}
.checklist li.bad small{color:var(--bad)}
.calc{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.calc .ln{display:flex;justify-content:space-between;gap:12px}
.calc .ln>span:first-child{color:var(--muted)}
.calc .ln small{display:block;font-size:11.5px;color:var(--faint)}
.calc .tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px;padding-top:9px;border-top:1px dashed var(--line-2)}
.calc .tot span{font-weight:600}
.calc .tot b{font:700 24px var(--f-display);color:var(--blue)}
.ep-act{display:flex;gap:8px;flex-wrap:wrap}
.ep-act .btn.primary,.ep-act .btn.ink{flex:1}
.poslog{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:7px;max-height:230px;overflow:auto;border-radius:10px;background:#0F1428;color:#C8D2EA;font:12px/1.45 var(--f-mono)}
.poslog li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px}
.poslog .d-out{color:#7DB6DA}
.poslog .d-in{color:#6CD29A}
.poslog .d-note{color:#E3B769}
.poslog small{display:block;color:#8791B0;word-break:break-word}
.bill{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bill-h{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px}
.bill-h b{font:600 13px var(--f-mono)}
.bill-lines{list-style:none;margin:0;padding:4px 0;max-height:250px;overflow:auto}
.bill-lines li{display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:10px;align-items:center;padding:6px 14px;font-size:13px}
.bill-lines .bl-n small{display:block;font-size:11px;color:var(--warn);font-weight:600}
.bill-lines .amt{text-align:right;font:500 13px var(--f-mono)}
.qty{display:inline-flex;align-items:center;overflow:hidden;border:1px solid var(--line);border-radius:8px}
.qty button{width:26px;height:26px;border:0;background:var(--surface-2);color:var(--ink-3);font-weight:700}
.qty button:hover:not(:disabled){background:var(--surface-3)}
.qty b{min-width:24px;text-align:center;font:600 12.5px var(--f-mono)}
.bill-empty{padding:18px 14px;color:var(--muted);font-size:13px;text-align:center}
.bill-tot{margin:0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);font-size:13px}
.bill-tot>div{display:flex;justify-content:space-between;gap:10px}
.bill-tot dt{color:var(--muted)}
.bill-tot dd{margin:0;font-family:var(--f-mono)}
.bill-tot .disc dt,.bill-tot .disc dd{color:var(--ok);font-weight:600}
.bill-tot .disc.pending dt,.bill-tot .disc.pending dd{color:var(--faint);font-weight:500}
.bill-tot .grand{margin-top:3px;padding-top:8px;border-top:1px solid var(--line)}
.bill-tot .grand dt{color:var(--ink);font:700 15px var(--f-display)}
.bill-tot .grand dd{color:var(--ink);font-weight:600;font-size:17px}
.receipt{align-self:center;width:100%;max-width:310px;padding:16px 16px 18px;border:1px solid var(--line);background:#FDFDFB;color:#1E1E1E;font:12px/1.55 var(--f-mono);box-shadow:0 14px 24px -18px rgba(21,27,53,.35)}
.receipt .c{text-align:center}
.receipt .hr{margin:7px 0;border-top:1px dashed #9A9A9A}
.receipt .l{display:flex;justify-content:space-between;gap:10px}
.receipt .b{font-weight:600}

/* scan dialog */
.segtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:14px 20px 0}
.segtab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;text-align:center}
.segtab.on{border-color:var(--blue);background:var(--blue-t);color:var(--blue)}
.finder{position:relative;align-self:center;width:260px;height:260px;max-width:100%;display:grid;place-items:center;overflow:hidden;border-radius:18px;background:#0F1428}
.finder-qr{width:172px;height:172px;padding:6px;border-radius:6px;background:#fff;transform:rotate(-4deg)}
.finder-qr svg{display:block;width:100%;height:100%}
.finder .cn{position:absolute;width:34px;height:34px;border:3px solid var(--wave)}
.cn.tl{top:18px;left:18px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.cn.tr{top:18px;right:18px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.cn.bl{bottom:18px;left:18px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.cn.br{bottom:18px;right:18px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.finder .scanline{position:absolute;left:26px;right:26px;height:2px;background:var(--wave);box-shadow:0 0 12px var(--wave);animation:scanline 2.2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:28px}50%{top:calc(100% - 30px)}}
.finder p{margin:0;padding:0 34px;color:#8E99BA;font-size:13px;text-align:center}
.shots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.shot{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.shot-qr{width:60px;height:60px}
.shot-qr svg{display:block;width:100%;height:100%}
.shot b{display:block;font-weight:600}
.shot small{display:block;font-size:12px;color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface-2);text-align:center;cursor:pointer}
.drop:hover{border-color:var(--blue)}
.drop .ic{width:28px;height:28px;color:var(--blue)}
.drop small{max-width:42ch;color:var(--muted)}

/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1500px;min-height:780px;margin:0 auto;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.adm-nav{display:flex;flex-direction:column;gap:2px;padding:16px 10px;background:var(--ink);color:#BCC5DE}
.adm-org{display:flex;flex-direction:column;padding:4px 12px 14px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.adm-org b{font:700 15px var(--f-display);color:#fff}
.adm-org small{font-size:12px;color:#8F9BBC}
.adm-nav>button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:8px;background:none;color:inherit;font-weight:500;text-align:left;white-space:nowrap}
.adm-nav>button:hover{color:#fff;background:rgba(255,255,255,.05)}
.adm-nav>button.on{background:rgba(255,255,255,.11);color:#fff}
.adm-nav .badge{margin-left:auto;padding:1px 7px;border-radius:99px;background:var(--bad-b);color:#fff;font:700 11px/1.5 var(--f-body);font-style:normal}
.adm-main{min-width:0;padding:22px 26px 40px}
@media (max-width:920px){.admin{grid-template-columns:minmax(0,1fr)}.adm-nav{flex-direction:row;overflow-x:auto;padding:8px}.adm-org{display:none}.adm-main{padding:18px 16px 32px}}
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:18px}
.pg-h h1{margin:0;font:700 24px/1.2 var(--f-display)}
.pg-h p{max-width:70ch;margin:4px 0 0;color:var(--muted)}
.pg-act{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{flex:1;min-width:200px;max-width:360px}
.toolbar select.input{width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{margin-top:6px;font:700 26px/1.1 var(--f-display);letter-spacing:-.01em}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .s{margin-top:4px;font-size:12px;color:var(--muted)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.cols-2.wide-left{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:1060px){.cols-2,.cols-2.wide-left{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.panel+.panel{margin-top:16px}
.cols-2>.panel+.panel{margin-top:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font:700 15px var(--f-display)}
.panel-h small{color:var(--muted);font-size:12.5px}
.pad{padding:14px 16px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;text-align:left;text-transform:uppercase;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBFD}
.tbl .r{text-align:right}
.tbl td small{display:block;font-size:12px;color:var(--muted)}
.tbl td b{font-weight:600}
.tbl td.num,.tbl .mono{font-size:12.5px}
.tbl tfoot td{border-top:1px solid var(--line);background:var(--surface-2);font-weight:600}
.tbl.compact td,.tbl.compact th{padding:7px 10px}
.tbl tr.rev td{color:var(--faint)}
.tbl-empty{padding:26px 16px;color:var(--muted);text-align:center}
.usage{display:flex;align-items:center;gap:10px;min-width:170px}
.usage .meter{flex:1;min-width:60px}
.usage span{font-size:12px;white-space:nowrap}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.alist{list-style:none;margin:0;padding:4px 16px 8px}
.alist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:0}
.alist .t{flex:1;min-width:0}
.alist .t b{display:block;font-weight:600}
.alist .t small{display:block;font-size:12.5px;color:var(--muted)}
.alist .ico{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:9px}
.alist .ico.warn{background:var(--warn-t);color:var(--warn)}
.alist .ico.bad{background:var(--bad-t);color:var(--bad)}
.alist .ico.info{background:var(--blue-t);color:var(--blue)}
.audit{list-style:none;margin:0;padding:4px 16px 10px}
.audit li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.audit li:last-child{border-bottom:0}
.audit time{color:var(--muted);font-size:12px}
.audit small{display:block;color:var(--muted);font-size:12px}
.card{display:flex;flex-direction:column;gap:14px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.card+.card{margin-top:16px}
.card h2{margin:0;font:700 16px var(--f-display)}
.card .sub{margin:-8px 0 0;color:var(--muted);font-size:13px;max-width:72ch}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ============================================================ discount maths */
function calcBill(brandId, cart, emp) {
  const b = brandById(brandId);
  const lines = cart.map(l => { const it = findItem(brandId, l.sku); if (!it) return null; return { ...it, qty: l.qty, total: r3(it.price * l.qty), eligible: !b.excluded.includes(it.cat) }; }).filter(Boolean);
  const subtotal = r3(sum(lines, l => l.total));
  const eligibleBase = r3(sum(lines.filter(l => l.eligible), l => l.total));
  const calculated = r3(eligibleBase * b.pct / 100);
  const remaining = emp ? remainingOf(emp) : 0;
  let applied = 0, outcome = 'none';
  if (emp) {
    if (calculated <= 0) outcome = 'nothing';
    else if (calculated <= remaining + 1e-9) { applied = calculated; outcome = 'full'; }
    else if (S().overflowRule === 'cap') { applied = remaining; outcome = 'capped'; }
    else outcome = 'rejected';

  return { lines, subtotal, eligibleBase, excludedBase: r3(subtotal - eligibleBase), pct: b.pct, calculated, remaining, applied: r3(applied), outcome, total: r3(subtotal - applied) };
}

}
const sessEmp = () => ui.emp.session ? empById(ui.emp.session) : null;

  tok.str = tokenString(tok);

/* ============================================================ verification (the server's job) */
function verify(input, till) {
  const checks = [];
  let reason = null, reasonKey = null;
  const add = (label, st, detail) => checks.push({ label, st, detail });
  const fail = (k, text) => { if (!reasonKey) { reasonKey = k; reason = text; } };
  const done = (tok, e) => ({ ok: !reasonKey, checks, reason, reasonKey, tok, emp: e || null });
  const skipRest = () => ['Employee', 'Eligibility', 'Brand', 'Branch', 'Allowance'].forEach(l => add(l, 'skip', 'Not checked'));

  let tok = null;
  if (input.str != null) {
    const p = parseToken(input.str);
    if (p.error) {
      add('QR code', 'bad', p.error === 'tampered' ? 'Signature doesn\'t match; the code was altered' : 'Not an employee discount code');
      fail(p.error, p.error === 'tampered' ? 'This code has been altered and can\'t be trusted.' : 'That isn\'t an employee discount code.');
      skipRest(); return done(null);
    }
    tok = state.tokens[p.payload.n];
    if (!tok) { add('QR code', 'bad', 'Not issued by the discount system'); fail('unknown', 'This code wasn\'t issued by the discount system.'); skipRest(); return done(null); }
    if (tok.empId !== p.payload.e || tok.brandId !== p.payload.b || tok.branchId !== p.payload.r) { add('QR code', 'bad', 'Details don\'t match the issued code'); fail('tampered', 'This code has been altered and can\'t be trusted.'); skipRest(); return done(null); }
  } else {
    const n = normNonce(input.nonce);
    tok = state.tokens[n];
    if (!tok) { add('Code', 'bad', `No code ${n ? fmtNonce(n) : ''} on record`); fail('unknown', `No code matches “${esc(input.nonce)}”. Check the 8 characters and try again.`); skipRest(); return done(null); }
  }

  const t = now();
  if (tok.status === 'used') { const x = txnByRef(tok.usedRef); add('QR code', 'bad', `Already used${x ? ` at ${where(x)}, ${fT(x.ts)}` : ''}`); fail('used', `This code has already been used${x ? ` (${where(x)}, ${fT(x.ts)})` : ''}. Each code works once.`); }
  else if (tok.status === 'superseded') { add('QR code', 'bad', 'Replaced by a newer code on the phone'); fail('superseded', 'This is an old code: the phone has already replaced it. Screenshots and old codes can\'t be used.'); }
  else if (tok.status === 'closed') { add('QR code', 'bad', 'Closed on the employee\'s phone'); fail('closed', 'The employee closed this code. Ask them to open a new one.'); }
  else if (tok.status === 'void') { add('QR code', 'bad', 'Cancelled at a till'); fail('void', 'This code was cancelled at a till. Ask the employee for a new one.'); }
  else if (tok.status === 'locked') { add('QR code', 'bad', 'Being used at another till right now'); fail('locked', 'This code is being used at another till right now.'); }
  else if (t >= tok.exp) { const s = Math.round((t - tok.exp) / 1000); add('QR code', 'bad', `Expired ${dur(s)} ago`); fail('expired', `This code expired ${dur(s)} ago. Ask the employee to show the live code.`); }
  else add('QR code', 'ok', `Live, signed, single-use · ${Math.ceil((tok.exp - t) / 1000)}s left`);

  const e = empById(tok.empId), b = brandById(tok.brandId), br = branchById(tok.branchId);
  const tb = brandById(till.brandId), tbr = branchById(till.branchId);
  if (!e) { add('Employee', 'bad', 'No employee record'); fail('no-emp', 'There is no employee record for this code.'); }
  else add('Employee', 'ok', `${e.id} · ${e.name}`);

  if (!e) add('Eligibility', 'skip', 'Not checked');
  else if (e.status !== 'active') { add('Eligibility', 'bad', 'Discount paused by HR'); fail('inactive', `${esc(first(e.name))}'s employee discount is paused by HR. Don't apply a discount.`); }
  else if (!eligibleFor(e, tok.brandId)) { add('Eligibility', 'bad', `${b?.name || 'This brand'} isn't in their plan`); fail('not-in-plan', `${esc(b?.name || 'This brand')} isn't included in this employee's plan.`); }
  else add('Eligibility', 'ok', `Active · ${b?.name} included in plan`);

  if (!b) { add('Brand', 'bad', 'Brand no longer exists'); fail('no-brand', 'The brand on this code no longer exists.'); }
  else if (!b.active) { add('Brand', 'bad', `${b.name} is switched off`); fail('brand-off', `${esc(b.name)} is switched off for employee discount.`); }
  else if (tb && tb.id !== b.id) { add('Brand', 'bad', `Code is for ${b.name}; this till is ${tb.name}`); fail('wrong-brand', `This code is for ${esc(b.name)}. This till belongs to ${esc(tb.name)}.`); }
  else add('Brand', 'ok', `${b.name} · ${b.pct}% staff rate`);

  if (!br) { add('Branch', 'bad', 'Branch no longer exists'); fail('no-branch', 'The branch on this code no longer exists.'); }
  else if (!br.active) { add('Branch', 'bad', `${br.name} is switched off`); fail('branch-off', `${esc(b?.name)} · ${esc(br.name)} is switched off for employee discount.`); }
  else if (tbr && tbr.id !== br.id) { add('Branch', 'bad', `Code is for ${br.name}; this till is ${tbr.name}`); fail('wrong-branch', `This code is for ${esc(b?.name)} · ${esc(br.name)}. This till is at ${esc(tbr.name)}.`); }
  else add('Branch', 'ok', `${br.name} · matches this till`);

  if (!e) add('Allowance', 'skip', 'Not checked');
  else { const rem = remainingOf(e), lim = allowanceOf(e); if (rem <= 0) { add('Allowance', 'bad', `Used up: ${kd(lim)} of ${kd(lim)} KD`); fail('limit', `${esc(first(e.name))}'s allowance is used up until ${fDY(period().end)}.`); } else add('Allowance', 'ok', `${kd(rem)} of ${kd(lim)} KD left`); }
  return done(tok, e);
}
function recheck(s, c) {
  const e = empById(s.empId), b = brandById(s.brandId), br = branchById(s.branchId);
  if (!e || e.status !== 'active') return { ok: false, reason: 'The employee\'s discount was paused by HR after the scan. No discount applied.' };
  if (!eligibleFor(e, s.brandId)) return { ok: false, reason: 'This brand was removed from the employee\'s plan after the scan.' };
  if (!b || !b.active) return { ok: false, reason: 'The brand was switched off after the scan.' };

const qrCache = new Map();

const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };

}

  const byBranch = state.branches.map(x => { const y = tx.filter(t => t.branchId === x.id); return { label: `${brandById(x.brandId)?.name} · ${x.name}`, sub: plural(y.length, 'purchase'), value: sum(y, t => t.discount), color: brandById(x.brandId)?.color }; }).filter(r => r.value > 0).sort((a, b) => b.value - a.value).slice(0, 12);

  // daily trend

    <div class="kpis">

    const e = id && empById(id);
    ui.modal = e ? { type: 'emp', id: e.id, isNew: false, draft: { id: e.id, name: e.name, dept: e.dept, mobile: e.mobile || '', allowance: e.allowance ?? '', status: e.status, brands: e.brands === 'all' ? 'all' : [...e.brands], photo: e.photo }, err: '' }
      : { type: 'emp', isNew: true, draft: { id: '', name: '', dept: '', mobile: '', allowance: '', status: 'active', brands: 'all', photo: null }, err: '' };
    render();
  },
  assignId() { const n = Math.max(1000, ...state.employees.map(e => +(/\d+$/.exec(e.id) || [0])[0])) + 1; ui.modal.draft.id = `EMP${n}`; render(); },
  empAllBrands(v, el) { ui.modal.draft.brands = el.checked ? 'all' : state.brands.map(b => b.id); render(); },
  async empPhoto(v, el) {
    const f = el.files && el.files[0]; if (!f) return;
    try { ui.modal.draft.photo = await photoFromFile(f); ui.modal.err = ''; } catch { ui.modal.err = 'That file couldn\'t be read as an image. Try a JPG or PNG.'; }
    render();
  },
  empPhotoRemove() { ui.modal.draft.photo = null; render(); },
  saveEmp() {
    const m = ui.modal, d = m.draft;
    const id = String(d.id).trim().toUpperCase(), name = String(d.name).trim(), mobile = String(d.mobile).replace(/\D/g, '');
    const allowance = String(d.allowance).trim();
    let err = '';
    if (m.isNew && !/^[A-Z]{2,5}\d{3,6}$/.test(id)) err = 'Employee ID should look like EMP1170: letters, then numbers.';
    else if (m.isNew && empById(id)) err = `${id} is already in use. Tap “Assign next” for a free ID.`;
    else if (!name) err = 'Enter the employee\'s full name.';
    else if (mobile && mobile.length !== 4) err = 'Mobile should be the last 4 digits only.';
    else if (allowance && !(parseFloat(allowance) >= 0 && parseFloat(allowance) <= 10000)) err = 'Allowance override must be a number between 0 and 10,000, or blank for the default.';
    else if (d.brands !== 'all' && !d.brands.length) err = 'Pick at least one brand, or tick All brands.';
    if (err) { m.err = err; return render(); }
    const rec = { name, dept: String(d.dept).trim() || 'Unassigned', mobile, allowance: allowance === '' ? null : r3(parseFloat(allowance)), status: d.status, brands: d.brands === 'all' ? 'all' : [...d.brands], photo: d.photo || null };
    if (m.isNew) { state.employees.push({ id, ...rec }); audit(`Added employee ${id} ${name}${rec.photo ? ' with photo' : ''}`); }
    else {
      const e = empById(m.id), changes = [];
      if (e.name !== rec.name) changes.push('name');
      if (e.dept !== rec.dept) changes.push('department');
      if ((e.mobile || '') !== rec.mobile) changes.push('mobile');
      if (e.allowance !== rec.allowance) changes.push(`allowance ${rec.allowance == null ? 'back to default' : `to ${kd(rec.allowance)} KD`}`);
      if (e.status !== rec.status) changes.push(rec.status === 'active' ? 'activated' : 'deactivated');
      if (JSON.stringify(e.brands) !== JSON.stringify(rec.brands)) changes.push('eligible brands');
      if (e.photo !== rec.photo) changes.push(rec.photo ? 'photo updated' : 'photo removed');
      Object.assign(e, rec);
      if (changes.length) audit(`Updated ${e.id} ${e.name}: ${changes.join(', ')}`);
    }
    ui.modal = null; save(); render(); toast(m.isNew ? `Added ${name} (${id}). They can sign in now.` : `Saved ${name}`);
  },
  toggleEmp(id) {
    const e = empById(id); if (!e) return;
    e.status = e.status === 'active' ? 'inactive' : 'active';
    audit(`${e.status === 'active' ? 'Activated' : 'Deactivated'} ${e.id} ${e.name}`);
    save(); render(); toast(e.status === 'active' ? `${e.name} is active again` : `${e.name} deactivated. Open codes stop working at the till.`);
  },
  openImport() { ui.modal = { type: 'import', text: SAMPLE_CSV, rows: null }; render(); },
  impFile(v, el) { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { ui.modal.text = String(rd.result); ui.modal.rows = null; render(); }; rd.readAsText(f); },
  impCheck() {
    const rows = parseCsv(ui.modal.text);
    if (rows.length && /employee_id/i.test(rows[0][0] || '')) rows.shift();
    const seen = new Set();
    ui.modal.rows = rows.map(r => {
      const [idRaw = '', name = '', dept = '', mob = '', brandsRaw = 'all'] = r.map(x => x.trim());
      const id = idRaw.toUpperCase();
      const out = { id, name, dept, mobile: mob.replace(/\D/g, '').slice(-4), brands: 'all', action: '', msg: '' };
      const bRaw = brandsRaw.toLowerCase();
      if (bRaw && bRaw !== 'all') {
        const parts = brandsRaw.split(/[;|]+/).map(x => x.trim()).filter(Boolean);
        const ids = parts.map(p => state.brands.find(b => b.id.toLowerCase() === p.toLowerCase() || b.name.toLowerCase() === p.toLowerCase())?.id);
        if (ids.some(x => !x)) { out.action = 'error'; out.msg = `Unknown brand in “${brandsRaw}”`; }
        out.brands = [...new Set(ids.filter(Boolean))];
      }
      if (!out.action) {
        if (!/^[A-Z]{2,5}\d{3,6}$/.test(id)) { out.action = 'error'; out.msg = 'Bad employee ID'; }
        else if (!name) { out.action = 'error'; out.msg = 'Missing name'; }
        else if (seen.has(id)) { out.action = 'error'; out.msg = 'Duplicate in file'; }
        else out.action = empById(id) ? 'update' : 'new';
      }
      seen.add(id);
      return out;
    });
    render();
  },
  impApply() {
    const rows = (ui.modal.rows || []).filter(r => r.action !== 'error');
    let added = 0, updated = 0;
    for (const r of rows) {
      const e = empById(r.id);
      if (e) { Object.assign(e, { name: r.name, dept: r.dept || e.dept, mobile: r.mobile || e.mobile, brands: r.brands }); updated++; }
      else { state.employees.push({ id: r.id, name: r.name, dept: r.dept || 'Unassigned', mobile: r.mobile, brands: r.brands, status: 'active', photo: null, allowance: null }); added++; }
    }
    audit(`Imported employees from CSV: ${added} new, ${updated} updated`);
    ui.modal = null; save(); render(); toast(`Imported: ${added} new, ${updated} updated`);
  },

  /* brands and branches */
  openBrand(id) {
    const b = id && brandById(id);
    ui.modal = b ? { type: 'brand', id: b.id, isNew: false, draft: { name: b.name, sector: b.sector, pct: String(b.pct), color: b.color, excluded: [...b.excluded], active: b.active }, err: '' }
      : { type: 'brand', isNew: true, draft: { name: '', sector: '', pct: '15', color: PALETTE[state.brands.length % PALETTE.length], excluded: ['Sale items', 'Gift cards'], active: true }, err: '' };
    render();
  },
  saveBrand() {
    const m = ui.modal, d = m.draft, name = String(d.name).trim(), pct = parseFloat(d.pct);
    if (!name) { m.err = 'Enter a brand name.'; return render(); }
    if (state.brands.some(b => b.name.toLowerCase() === name.toLowerCase() && b.id !== m.id)) { m.err = `There's already a brand called ${name}.`; return render(); }
    if (!(pct >= 0 && pct <= 100)) { m.err = 'Staff rate must be between 0 and 100%.'; return render(); }
    if (m.isNew) {
      const letters = 'FGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c => !brandById(c));
      const id = letters[0] || `N${state.brands.length + 1}`;
      state.brands.push({ id, name, sector: String(d.sector).trim() || 'Retail', pct, color: d.color, active: d.active, excluded: [...d.excluded] });
      state.catalog[id] = [['Item', 'General', 10], ['Item', 'General', 25], ['Item', 'General', 60], ['Sale item', 'Sale items', 8], ['Gift card', 'Gift cards', 20]].map(([n, c, p], i) => ({ sku: id + String(i + 1).padStart(2, '0'), name: n === 'Item' ? `Sample item ${kd(p).replace('.000', '')} KD` : n, cat: c, price: p }));
      audit(`Added brand ${name} at ${pct}%`);
      ui.modal = null; ui.admin.rules = null; save(); render(); toast(`${name} added. Now add its branches under Branches.`);
    } else {
      const b = brandById(m.id), ch = [];
      if (b.name !== name) ch.push(`renamed to ${name}`);
      if (b.pct !== pct) ch.push(`rate ${b.pct}% → ${pct}%`);
      if (b.active !== d.active) ch.push(d.active ? 'switched on' : 'switched off');
      if (JSON.stringify(b.excluded) !== JSON.stringify(d.excluded)) ch.push('exclusions changed');
      Object.assign(b, { name, sector: String(d.sector).trim() || b.sector, pct, color: d.color, active: d.active, excluded: [...d.excluded] });
      if (ch.length) audit(`Brand ${name}: ${ch.join(', ')}`);
      ui.modal = null; ui.admin.rules = null; save(); render(); toast(`Saved ${name}`);
    }
  },
  toggleBrand(id) { const b = brandById(id); b.active = !b.active; audit(`${b.active ? 'Switched on' : 'Switched off'} brand ${b.name}`); ui.admin.rules = null; save(); render(); toast(b.active ? `${b.name} is back on` : `${b.name} switched off. Employees no longer see it.`); },
  openBranch(id) {
    const x = id && branchById(id);
    ui.modal = x ? { type: 'branch', id: x.id, isNew: false, draft: { name: x.name, brandId: x.brandId, gov: x.gov, active: x.active }, err: '' }
      : { type: 'branch', isNew: true, draft: { name: '', brandId: ui.admin.brFilter !== 'all' ? ui.admin.brFilter : state.brands[0].id, gov: 'Capital', active: true }, err: '' };
    render();
  },
  saveBranch() {
    const m = ui.modal, d = m.draft, name = String(d.name).trim();
    if (!name) { m.err = 'Enter a branch name.'; return render(); }
    if (state.branches.some(x => x.brandId === d.brandId && x.name.toLowerCase() === name.toLowerCase() && x.id !== m.id)) { m.err = `${brandById(d.brandId).name} already has a branch called ${name}.`; return render(); }
    if (m.isNew) {
      const id = 'S' + String(++state.seq.branch).padStart(2, '0');
      state.branches.push({ id, brandId: d.brandId, name, gov: d.gov, active: d.active });
      audit(`Added branch ${brandById(d.brandId).name} · ${name}`);
      toast(`${brandById(d.brandId).name} · ${name} added`);
    } else {
      const x = branchById(m.id), ch = [];
      if (x.brandId !== d.brandId) ch.push(`moved from ${brandById(x.brandId).name} to ${brandById(d.brandId).name}`);
      if (x.name !== name) ch.push(`renamed to ${name}`);
      if (x.active !== d.active) ch.push(d.active ? 'opened' : 'switched off');
      if (ui.pos.branchId === x.id && x.brandId !== d.brandId) { cancelSession(true); ui.pos.cart = []; ui.pos.brandId = d.brandId; }
      Object.assign(x, { name, brandId: d.brandId, gov: d.gov, active: d.active });
      if (ch.length) audit(`Branch ${name}: ${ch.join(', ')}`);
      toast(`Saved ${name}`);
    }
    ui.modal = null; save(); render();
  },
  toggleBranch(id) { const x = branchById(id), b = brandById(x.brandId); x.active = !x.active; audit(`${x.active ? 'Opened' : 'Switched off'} branch ${b.name} · ${x.name}`); save(); render(); toast(x.active ? `${b.name} · ${x.name} is open again` : `${b.name} · ${x.name} switched off. It's hidden from employees.`); },

  /* rules */
  discardRules() { ui.admin.rules = null; render(); toast('Changes discarded'); },
  saveRules() {
    const r = ui.admin.rules, s = S(), errs = [], ch = [];
    const allowance = parseFloat(r.allowance);
    if (!(allowance > 0 && allowance <= 10000)) errs.push('Allowance must be between 0 and 10,000 KD.');
    const rates = {};
    for (const b of state.brands) { const p = parseFloat(r.brands[b.id]?.pct); if (!(p >= 0 && p <= 100)) errs.push(`${b.name}: rate must be 0–100%.`); rates[b.id] = p; }
    if (errs.length) { r.err = errs.join(' '); return render(); }
    if (s.allowance !== allowance) ch.push(`allowance ${kd(s.allowance)} → ${kd(allowance)} KD`);
    if (s.resetPeriod !== r.resetPeriod) ch.push(`resets ${r.resetPeriod}`);
    if (s.nearLimitPct !== +r.nearLimitPct) ch.push(`flag at ${r.nearLimitPct}%`);
    if (s.overflowRule !== r.overflowRule) ch.push(r.overflowRule === 'cap' ? 'over-limit rule: apply what\'s left (A)' : 'over-limit rule: don\'t apply (B)');
    if (s.qrTtl !== +r.qrTtl) ch.push(`new code every ${r.qrTtl}s`);
    if (s.requirePhotoCheck !== !!r.requirePhotoCheck) ch.push(r.requirePhotoCheck ? 'photo check required' : 'photo check optional');
    Object.assign(s, { allowance, resetPeriod: r.resetPeriod, nearLimitPct: +r.nearLimitPct, overflowRule: r.overflowRule, qrTtl: +r.qrTtl, requirePhotoCheck: !!r.requirePhotoCheck });
    for (const b of state.brands) {
      const d = r.brands[b.id];
      if (b.pct !== rates[b.id]) ch.push(`${b.name} ${b.pct}% → ${rates[b.id]}%`);
      if (JSON.stringify([...b.excluded].sort()) !== JSON.stringify([...d.excluded].sort())) ch.push(`${b.name} exclusions`);
      b.pct = rates[b.id]; b.excluded = [...d.excluded];
    }
    if (ch.length) audit(`Discount rules: ${ch.join('; ')}`);
    ui.admin.rules = null; save(); render(); toast(ch.length ? `Saved ${plural(ch.length, 'change')}. The app and tills use them now.` : 'Nothing changed');
  },
  askNewPeriod() {
    ui.modal = { type: 'confirm', title: 'Start a new allowance period now?', body: `Every employee's used amount goes back to zero and they get their full allowance. Past transactions stay in the ledger. The current period (${periodLabel()}) ends now.`, label: 'Start new period', danger: false,
      run: () => { S().periodStart = now(); audit(`Started a new allowance period manually (${periodLabel()})`); ui.admin.rules = null; save(); render(); toast('New period started. Everyone has their full allowance.'); } };
    render();
  },

  /* ledger */
  openTxn(ref) { ui.modal = { type: 'txn', ref }; render(); },
  askReverse(ref) {
    const t = txnByRef(ref); if (!t) return;
    const e = empById(t.empId);
    ui.modal = { type: 'confirm', title: `Reverse ${ref}?`, reason: 'Goods returned', label: 'Reverse transaction', danger: true,
      body: `${KD(t.discount)} goes back into ${esc(e?.name || t.empId)}'s allowance${inPeriod(t.ts) ? '' : ' (this is from an earlier period, so their current balance won\'t change)'}. The row stays in the ledger, marked as reversed.`,
      extra: `<div class="field"><label for="rv-reason">Reason</label><select class="input" id="rv-reason" data-bind="modal.reason">${['Goods returned', 'Processed in error', 'Duplicate transaction', 'Other'].map(x => `<option>${x}</option>`).join('')}</select></div>`,
      run: m => { t.status = 'reversed'; t.reversedAt = now(); t.reverseReason = m.reason; audit(`Reversed ${ref} (${m.reason}): ${KD(t.discount)} returned to ${t.empId}`); save(); render(); toast(`Reversed. ${KD(t.discount)} is back in ${first(e?.name)}'s allowance.`); } };
    render();
  },
  exportCsv() {
    const rows = ledgerRows();
    const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const cols = [['reference', t => t.ref], ['date', t => new Date(t.ts).toISOString().slice(0, 10)], ['time', t => fT(t.ts)], ['employee_id', t => t.empId], ['employee', t => empById(t.empId)?.name || ''], ['brand', t => brandById(t.brandId)?.name], ['branch', t => branchById(t.branchId)?.name], ['purchase_kd', t => raw3(t.purchase)], ['eligible_kd', t => raw3(t.eligibleBase)], ['rate_pct', t => t.pct], ['discount_kd', t => raw3(t.discount)], ['remaining_after_kd', t => raw3(t.remainingAfter)], ['status', t => t.status], ['pos_mode', t => t.mode], ['pos_receipt', t => t.posRef], ['payment', t => t.payment]];
    const text = [cols.map(c => c[0]).join(','), ...rows.map(t => cols.map(c => q(c[1](t))).join(','))].join('\n');
    ui.modal = { type: 'csv', text, count: rows.length }; render();
  },
  async copyCsv() {
    const ta = document.getElementById('csv-text');
    try { await navigator.clipboard.writeText(ta.value); toast('Copied. Paste into Excel or Google Sheets.'); }
    catch { ta.focus(); ta.select(); toast('Press Ctrl+C (⌘C on Mac) to copy the selected text.'); }
  },

  /* pos */
  posMode(v) { S().posMode = v; audit(`Tills set to ${v === 'integrated' ? 'integrated POS' : 'manual POS entry'}`); save(); render(); toast(v === 'integrated' ? 'Tills now push the discount to the POS' : 'Tills now use manual entry'); },
  savePosSystem() {
    const v = String(ui.admin.posSys ?? S().posSystem).trim();
    if (v === S().posSystem) return toast('Nothing changed');
    S().posSystem = v; ui.admin.posSys = null;
    audit(`POS system noted as “${v || 'to be confirmed'}”`); save(); render(); toast(v ? `Saved: ${v}` : 'POS system cleared');
  },
};
function parseCsv(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

/* ============================================================ events */
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.matches && t.matches('[data-scrim]')) { ACT.closeModal(); return; }
  if (t.closest && t.closest('[data-close-drawer]')) { ui.drawer = false; render(); return; }
  const el = t.closest && t.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  ev.preventDefault();
  fn(el.dataset.arg, el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.bind || el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  setPath(ui, el.dataset.bind, el.value);
  if ('live' in el.dataset) render();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (!el.dataset) return;
  if (el.dataset.change) { ACT[el.dataset.change]?.(el.value, el, ev); return; }
  if (el.dataset.toggleIn) {
    const arr = getPath(ui, el.dataset.toggleIn);
    if (Array.isArray(arr)) { const i = arr.indexOf(el.value); if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1); }
    if ('live' in el.dataset) render();
    return;
  }
  if (el.dataset.bind) {
    // Text fields are already bound on input; re-rendering on blur would swallow the click that caused it.
    const textLike = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['checkbox', 'radio', 'file'].includes(el.type));
    if (textLike) return;
    setPath(ui, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
    if ('live' in el.dataset || el.type === 'radio') render();
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  ACT[f.dataset.form]?.(null, f, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (ui.modal) ACT.closeModal(); else if (ui.drawer) { ui.drawer = false; render(); }
});
window.addEventListener('storage', ev => {
  if (ev.key !== KEY || !ev.newValue) return;
  try { const s = JSON.parse(ev.newValue); if (s && s.v === VERSION) { state = s; render(); } } catch { /* ignore */ }
});

/* ============================================================ clock */
function tick() {
  const t = now();
  if (ui.emp.session && ui.emp.screen === 'code') {
    const tok = liveToken();
    const stale = !tok || (tok.status === 'live' && t >= tok.exp) || ['superseded', 'expired', 'closed'].includes(tok.status);
    if (stale && ui.emp.brandId && ui.emp.branchId) { if (tok && tok.status === 'live') tok.status = 'superseded'; issueToken(); partial(); }
  }
  setText('sb-time', fT(t)); setText('till-clock', fT(t));
  const tok = ui.emp.screen === 'code' ? liveToken() : null;
  if (tok && tok.status === 'live') {
    const left = Math.max(0, tok.exp - t);
    setText('cd-num', Math.ceil(left / 1000));
    setText('live-clock', fTS(t));
    const ring = document.getElementById('cd-ring');
    if (ring) ring.style.strokeDashoffset = (RING_C * (1 - left / (tok.exp - tok.iat))).toFixed(2);
  }
}

save();
render();
setInterval(tick, 250);
})();

</script>
